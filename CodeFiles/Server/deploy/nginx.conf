# ──────────────────────────────────────────────────────────────────────────────
# nginx reverse proxy for the AI Music Detector auth API.
#
# What it does:
#   • Sits in front of the uvicorn process (127.0.0.1:8000) and forwards traffic.
#   • Applies per-IP rate limits to the sensitive auth endpoints, rejecting
#     abusive traffic (password brute-forcing, mass signups, email bombing)
#     BEFORE it ever reaches Python.
#   • Returns 429 Too Many Requests when a client exceeds its limit.
#
# Why a proxy instead of app-level limiting:
#   Requests blocked here never hit FastAPI, so scripted floods can't burn
#   backend CPU, and the same rules cover every worker/instance uniformly.
#
# Install (Linux):
#   1. Run the app:   uvicorn Server:app --host 127.0.0.1 --port 8000
#   2. Copy this file to /etc/nginx/conf.d/ai-music-detector.conf
#   3. Edit `server_name` (and the TLS block) below.
#   4. Test + reload:  sudo nginx -t && sudo nginx -s reload
# ──────────────────────────────────────────────────────────────────────────────

# ── Rate-limit zones (must live in the http{} context) ────────────────────────
# $binary_remote_addr keys the limit on the client IP in a compact form.
# 10m of shared memory tracks ~160k distinct IPs. `rate` is the sustained
# ceiling; short spikes are absorbed by `burst` in each location below.
limit_req_zone $binary_remote_addr zone=login:10m   rate=10r/m;   # login guesses
limit_req_zone $binary_remote_addr zone=auth:10m    rate=6r/m;    # signup / reset abuse
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;   # loose safety net

# Reply 429 (not nginx's default 503) when a limit is exceeded.
limit_req_status 429;

upstream ai_music_backend {
    server 127.0.0.1:8000;      # the uvicorn process
}

server {
    listen 80;
    server_name _;              # ← replace with your domain, e.g. api.example.com

    # ── TLS (strongly recommended in production) ──────────────────────────────
    # Tokens and passwords cross this connection — terminate HTTPS here.
    # listen 443 ssl;
    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # If nginx itself sits behind another proxy/CDN (e.g. Cloudflare), the limit
    # would otherwise key on the CDN's IP and treat all users as one client.
    # Uncomment and restrict the CIDR to your CDN's ranges to recover the real IP:
    # set_real_ip_from  0.0.0.0/0;
    # real_ip_header    X-Forwarded-For;
    # real_ip_recursive on;

    # Forwarded headers so the backend logs/sees the real client, not nginx.
    # Set at server scope; inherited by every location below.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Sensitive auth endpoints — tight limits ───────────────────────────────
    # burst = how many requests may jump the queue in a spike; nodelay serves
    # them immediately (good UX for a user retyping a password) rather than
    # spacing them out. Beyond burst, excess requests get 429.
    location = /login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://ai_music_backend;
    }

    location = /signup {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://ai_music_backend;
    }

    location = /forgot-password {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://ai_music_backend;
    }

    location = /verify-code {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://ai_music_backend;
    }

    location = /reset-password {
        limit_req zone=auth burst=3 nodelay;
        proxy_pass http://ai_music_backend;
    }

    # ── Everything else — loose net to catch general flooding ─────────────────
    location / {
        limit_req zone=general burst=60 nodelay;
        proxy_pass http://ai_music_backend;
    }
}
